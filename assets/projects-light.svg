t="40" rx="12" fill="#e8f1ff" stroke="#94b7ed"/><rect x="208" y="120" width="72" height="40" rx="12" fill="#e9f9ef" stroke="#8bd1a2"/><text x="244" y="25" text-anchor="middle" class="tag">Event</text><text x="244" y="84" text-anchor="middle" class="tag">Data</text><text x="244" y="145" text-anchor="middle" class="tag">Cache</text></g></g><g filter="url(#s)"><rect x="28" y="394" width="358" height="184" rx="22" fill="#e8f1ff" stroke="#94b7ed"/><text x="52" y="427" class="k" fill="#4d7fc9">02 / DATABASE PERFORMANCE</text><text x="52" y="465" class="sh">DB Stress Framework</text><text x="52" y="497" class="p">Concurrent JDBC workloads with live</text><text x="52" y="519" class="p">throughput and latency percentiles.</text><text x="52" y="553" class="tag">JAVA · JDBC · WEBSOCKET</text><rect x="414" y="394" width="358" height="184" rx="22" fill="#e9f9ef" stroke="#8bd1a2"/><text x="438" y="427" class="k" fill="#3a9b5a">03 / PRODUCTION DIAGNOSTICS</text><text x="438" y="465" class="sh">Log Intelligence Tool</text><text x="438" y="497" class="p">Pattern-driven log analysis for root-cause</text><text x="438" y="519" class="p">signals and remediation workflows.</text><text x="438" y="553" class="tag">JAVA · SPRING BOOT · FLYWAY</text><rect x="28" y="608" width="358" height="184" rx="22" fill="#fff0e9" stroke="#f1a98d"/><text x="52" y="641" class="k" fill="#d57650">04 / PRODUCTIVITY</text><text x="52" y="679" class="sh">Job Radar</text><text x="52" y="711" class="p">Local-first discovery and application tracking</text><text x="52" y="733" class="p">with evidence-based matching.</text><text x="52" y="767" class="tag">JAVA 21 · POSTGRESQL · NEXT.JS</text><rect x="414" y="608" width="358" height="184" rx="22" fill="#fff7dc" stroke="#e7bd55"/><text x="438" y="641" class="k" fill="#a66d08">05 / INTERVIEW LEARNING</text><text x="438" y="679" class="sh">Self Drill</text><text x="438" y="711" class="p">Resume-driven questions from deterministic</text><text x="438" y="733" class="p">pa