<svg xmlns="http://www.w3.org/2000/svg" width="800" height="240" viewBox="0 0 800 240" role="img" aria-labelledby="t"><title id="t">Engineering philosophy</title><rect width="800" height="240" rx="22" fill="#fffdf9"/><rect x="28" y="28" width="7" height="184" rx="4" fill="#2a9d8f"/><text x="58" y="94" font-family="ui-serif,Georgia,serif" font-size="82" fill="#b9e7df">“</text><text x="118" y="83" font-family="ui-sans-serif,system-ui" font-size="18" font-weight="700" fill="#243145">I build backend systems where correctness, failure handling,</text><text x="118" y="116" font-family="ui-sans-serif,system-ui" font-size="18" font-weight="700" fill="#243145">performance, and observability matter.</text><text x="118" y="164" font-family="ui-serif,Georgia,serif" font-size="17" fill="#667085">Systems should remain understandable as they grow—</text><text x="118" y="192" font-family="ui-serif,Georgia,serif" font-size="17" fill="#667085">and useful when something goes wrong.</text></svg>
