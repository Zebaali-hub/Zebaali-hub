<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430" role="img" aria-labelledby="t d"><title id="t">Engineering journey and learning loop</title><desc id="d">A focus timeline from backend foundations through data and distributed systems to building Java Backend Engineering in public, with a continuous learning code loop.</desc><style>.h{font:800 19px ui-sans-serif,system-ui;fill:#243145}.k{font:800 11px ui-monospace,monospace;letter-spacing:1px}.p{font:15px ui-sans-serif,system-ui;fill:#475467}.c{font:14px ui-monospace,monospace;fill:#344054}</style><rect width="800" height="430" rx="24" fill="#fbfcfe"/><text x="30" y="47" class="h">ENGINEERING JOURNEY</text><rect x="28" y="72" width="462" height="326" rx="22" fill="#f4f8ff" stroke="#c9d8ef"/><path d="M84 126V344" stroke="#94b7ed" stroke-width="3"/><circle cx="84" cy="132" r="9" fill="#2a9d8f"/><circle cx="84" cy="226" r="9" fill="#8b5cf6"/><circle cx="84" cy="338" r="11" fill="#f28c66"/><text x="118" y="120" class="k" fill="#168478">FOUNDATIONS</text><text x="118" y="147" class="h">Backend Engineering</text><text x="118" y="177" class="p">Java · databases · system fundamentals</text><text x="118" y="214" class="k" fill="#8066c2">EVOLUTION</text><text x="118" y="241" class="h">Distributed Systems</text><text x="118" y="271" class="p">events · reliability · observability</text><text x="118" y="326" class="k" fill="#d57650">BUILDING IN PUBLIC</text><text x="118" y="353" class="h">Java Backend Engineering</text><text x="118" y="379" class="p">community-oriented · in development</text><rect x="518" y="72" width="254" height="326" rx="22" fill="#fff7dc" stroke="#e7bd55"/><text x="544" y="111" class="k" fill="#a66d08">LEARNING LOOP</text><text x="544" y="163" class="c">while (learning) {</text><text x="562" y="200" class="c">build();</text><text x="562" y="237" class="c">breakThings();</text><text x="562" y="274" class="c">observe();</text><text x="562" y="311" class="c">improve();</text><text x="544" y="348" class="c">}</text></svg>
