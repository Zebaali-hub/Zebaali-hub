<svg xmlns="http://www.w3.org/2000/svg" width="800" height="230" viewBox="0 0 800 230" role="img" aria-labelledby="t"><title id="t">Code, systems, and impact</title><defs><linearGradient id="g" x2="1"><stop stop-color="#e7f7f4"/><stop offset=".5" stop-color="#f6f3ff"/><stop offset="1" stop-color="#fff0e9"/></linearGradient></defs><rect width="800" height="230" rx="26" fill="url(#g)"/><circle cx="70" cy="66" r="25" fill="#fff" stroke="#7dd3c7"/><path d="M59 66l8 8 15-18" fill="none" stroke="#2a9d8f" stroke-width="3"/><text x="112" y="70" font-family="ui-serif,Georgia,serif" font-size="23" fill="#243145">Code is how I express logic.</text><text x="112" y="112" font-family="ui-serif,Georgia,serif" font-size="23" fill="#243145">Systems are how I solve problems.</text><text x="112" y="154" font-family="ui-serif,Georgia,serif" font-size="23" fill="#243145">Impact is why I build.</text><text x="112" y="198" font-family="ui-monospace,monospace" font-size="11" font-weight="700" fill="#667085" letter-spacing="1">DESIGN THE BOUNDARIES · OBSERVE THE BEHAVIOR · IMPROVE THE SYSTEM</text></svg>
