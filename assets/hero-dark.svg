<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Hi, I'm Zeba Ali — Backend Engineer</title>
  <desc id="desc">An editorial introduction beside a connected backend system of services, Kafka, PostgreSQL, Redis, and observability.</desc>
