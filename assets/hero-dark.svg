  <text x="58" y="82" class="serif" fill="#b9c0cc" font-size="25" font-style="italic">Hi, I'm</text><text x="55" y="158" class="sans" fill="#f2f4f7" font-size="70" font-weight="800" letter-spacing="-2.5">ZEBA ALI</text><rect x="58" y="181" width="56" height="5" rx="2.5" fill="#7dd3c7"/><text x="58" y="226" class="serif" fill="#d0d5dd" font-size="26">Backend Engineer crafting robust systems.</text><text x="58" y="262" class="serif" fill="#d0d5dd" font-size="26">Observable, scalable, and distributed by design.</text><text x="58" y="321" class="mono" fill="#7dd3c7" font-size="15" font-weight="700">JAVA  •  SPRING BOOT  •  DISTRIBUTED SYSTEMS  •  DATABASES</text><text x="58" y="374" class="sans" fill="#98a2b3" font-size="13">correctness / failure handling / performance / observability</text>
