  <style>.sans{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.serif{font-family:ui-serif,Georgia,Cambria,"Times New Roman",serif}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.node{fill:#1f2937;stroke:#475467;stroke-width:1.5}.flow{fill:none;stroke:#667085;stroke-width:1.5;marker-end:url(#arrow)}.label{fill:#e4e7ec;font-size:12px;font-weight:700}.detail{fill:#98a2b3;font-size:9px;letter-spacing:.7px}@media(prefers-reduced-motion:reduce){.motion{display:none}}</style>
