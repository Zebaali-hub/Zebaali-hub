<svg xmlns="http://www.w3.org/2000/svg" width="600" height="760" viewBox="0 0 600 760" role="img" aria-labelledby="title desc"><title id="title">Conceptual backend architecture for narrow screens</title><desc id="desc">Clients connect through an API gateway to services, then to Kafka, PostgreSQL, Redis, and observability.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0l10 5-10 5z" fill="#98a2b3"/></marker></defs><style>.s{font-family:ui-sans-serif,system-ui}.m{font-family:ui-monospace,monospace}.t{fill:#344054;font-size:18px;font-weight:700}.box{fill:#fff;stroke:#cdd5df;stroke-width:1.6}.f{fill:none;stroke:#98a2b3;stroke-width:1.8;marker-end:url(#a)}@media(prefers-reduced-motion:reduce){.e{display:none}}</style><rect width="600" height="760" rx="24" fill="#fbfcfe" stroke="#e4e7ec"/><text x="32" y="46" class="m" fill="#667085" font-size="13">BACKEND SYSTEM LANDSCAPE</text><path class="f" d="M300 125V174M300 244V294M300 364V420M300 490V540M300 610V665"/><g class="box"><rect x="210" y="75" width="180" height="50" rx="15"/><rect x="195" y="174" width="210" height="70" rx="17"/><rect x="80" y="294" width="130" height="70" rx="17"/><rect x="235" y="294" width="130" height="70" rx="17"/><rect x="390" y="294" width="130" height="70" rx="17"/></g><rect x="42" y="420" width="516" height="70" rx="20" fill="#eef8f6" stroke="#7dd3c7"/><rect x="55" y="540" width="145" height="70" rx="17" fill="#eeeaff" stroke="#b9a7eb"/><rect x="227" y="540" width="145" height="70" rx="17" fill="#e8f1ff" stroke="#94b7ed"/><rect x="400" y="540" width="145" height="70" rx="17" fill="#e9f9ef" stroke="#8bd1a2"/><rect x="190" y="665" width="220" height="62" rx="17" fill="#fff1eb" stroke="#f1a98d"/><g class="s t" text-anchor="middle"><text x="300" y="107">Clients</text><text x="300" y="216">API Gateway</text><text x="145" y="336">Service A</text><text x="300" y="336">Service B</text><text x="455" y="336">Service C</text><text x="300" y="462">Event / Data Layer</text><text x="127" y="582">Kafka</text><text x="299" y="582">PostgreSQL</text><text x="472" y="582">Redis</text><text x="300" y="703">Observability</text></g><circle class="e" r="5" fill="#8b5cf6"><animateMotion dur="6s" repeatCount="indefinite" path="M300 125V209H145V329H300V455H127V575"/></circle></svg>
