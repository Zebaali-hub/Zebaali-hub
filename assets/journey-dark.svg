<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430" role="img" aria-labelledby="t d"><title id="t">Engineering journey and learning loop</title><desc id="d">A focus timeline from backend foundations through data and distributed systems to building Java Backend Engineering in public, with a continuous learning code loop.</desc><style>.h{font:800 19px ui-sans-serif,system-ui;fill:#f2f4f7}.k{font:800 11px ui-monospace,monospace;letter-spacing:1px}.p{font:15px ui-sans-serif,system-ui;fill:#b9c0cc}.c{font:14px ui-monospace,monospace;fill:#e4e7ec}</style><rect width="800" height="430" rx="24" fill="#151827"/><text x="30" y="47" class="h">ENGINEERING JOURNEY</text><rect x="28" y="72" width="462" height="326" rx="22" fill="#1b2940" stroke="#5278ae"/><path d="M84 126V344" stroke="#5278ae" stroke-width="3"/><circle cx="84" cy="132" r="9" fill="#7dd3c7"/><circle cx="84" cy="226" r="9" fill="#b9a7eb"/><circle cx="84" cy="338" r="11" fill="#f1a98d"/><text x="118" y="120" class="k" fill="#7dd3c7">FOUNDATIONS</text><text x="118" y="147" class="h">Backend Engineering</text><text x="118" y="177" class="p">Java · databases · system fundamentals</text><text x="118" y="214" class="k" fill="#b9a7eb">EVOLUTION</text><text x="118" y="241" class="h">Distributed Systems</text><text x="118" y="271" class="p">events · reliability · observability</text><text x="118" y="326" class="k" fill="#f1a98d">BUILDING IN PUBLIC</text><text x="118" y="353" class="h">Java Backend Engineering</text><text x="118" y="379" class="p">community-oriented · in development</text><rect x="518" y="72" width="254" height="326" rx="22" fill="#493b20" stroke="#a98230"/><text x="544" y="111" class="k" fill="#f0cc72">LEARNING LOOP</text><text x="544" y="163" class="c">while (learning) {</text><text x="562" y="200" class="c">build();</text><text x="562" y="237" class="c">breakThings();</text><text x="562" y="274" class="c">observe();</text><text x="562" y="311" class="c">improve();</text><text x="544" y="348" class="c">}</text></svg>
