<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Hi, I'm Zeba Ali — Backend Engineer</title>
  <desc id="desc">An editorial introduction beside a connected backend system of services, Kafka, PostgreSQL, Redis, and observability.</desc>
  <defs>
    <linearGradient id="wash" x1="0" x2="1"><stop stop-color="#f7fbff"/><stop offset=".56" stop-color="#ffffff"/><stop offset="1" stop-color="#f8f6ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#344054" flood-opacity=".08"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0l10 5-10 5z" fill="#98a2b3"/></marker>
  </defs>
  <style>
    .sans{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.serif{font-family:ui-serif,Georgia,Cambria,"Times New Roman",serif}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.node{fill:#fff;stroke:#d0d5dd;stroke-width:1.5}.flow{fill:none;stroke:#98a2b3;stroke-width:1.5;marker-end:url(#arrow)}.label{fill:#344054;font-size:12px;font-weight:700}.detail{fill:#667085;font-size:9px;letter-spacing:.7px}@media(prefers-reduced-motion:reduce){.motion{display:none}}
  </style>
  <rect width="1200" height="430" rx="26" fill="url(#wash)"/><path d="M0 336C250 292 420 378 660 334S994 278 1200 322V430H0Z" fill="#eef8f6" opacity=".8"/>
  <circle cx="1110" cy="58" r="94" fill="#efeaff" opacity=".72"/><circle cx="1040" cy="368" r="72" fill="#ffece5" opacity=".56"/>
  <text x="58" y="82" class="serif" fill="#667085" font-size="25" font-style="italic">Hi, I'm</text>
  <text x="55" y="158" class="sans" fill="#101828" font-size="70" font-weight="800" letter-spacing="-2.5">ZEBA ALI</text>
  <rect x="58" y="181" width="56" height="5" rx="2.5" fill="#2a9d8f"/>
  <text x="58" y="226" class="serif" fill="#344054" font-size="26">Backend Engineer crafting robust systems.</text>
  <text x="58" y="262" class="serif" fill="#344054" font-size="26">Observable, scalable, and distributed by design.</text>
  <text x="58" y="321" class="mono" fill="#107569" font-size="15" font-weight="700">JAVA  •  SPRING BOOT  •  DISTRIBUTED SYSTEMS  •  DATABASES</text>
  <text x="58" y="374" class="sans" fill="#667085" font-size="13">correctness / failure handling / performance / observability</text>
  <g filter="url(#shadow)">
    <rect x="705" y="154" width="132" height="74" rx="18" fill="#e7f7f4" stroke="#7dd3c7" stroke-width="1.7"/>
    <text x="771" y="184" text-anchor="middle" class="detail">CORE</text><text x="771" y="207" text-anchor="middle" class="label">Services</text>
  </g>
  <g class="flow"><path d="M648 191H705"/><path d="M837 178L922 105"/><path d="M837 190H930"/><path d="M837 205L922 280"/><path d="M771 228V315"/></g>
  <g filter="url(#shadow)">
    <rect x="556" y="164" width="92" height="54" rx="14" class="node"/><text x="602" y="186" text-anchor="middle" class="detail">EDGE</text><text x="602" y="204" text-anchor="middle" class="label">API</text>
    <rect x="922" y="72" width="118" height="62" rx="16" fill="#eeeaff" stroke="#b9a7eb"/><text x="981" y="97" text-anchor="middle" class="detail">EVENTS</text><text x="981" y="118" text-anchor="middle" class="label">Kafka</text>
    <rect x="930" y="160" width="136" height="62" rx="16" fill="#e8f1ff" stroke="#94b7ed"/><text x="998" y="185" text-anchor="middle" class="detail">PERSISTENCE</text><text x="998" y="206" text-anchor="middle" class="label">PostgreSQL</text>
    <rect x="922" y="252" width="118" height="62" rx="16" fill="#e9f9ef" stroke="#8bd1a2"/><text x="981" y="277" text-anchor="middle" class="detail">CACHE</text><text x="981" y="298" text-anchor="middle" class="label">Redis</text>
    <rect x="698" y="315" width="146" height="58" rx="16" fill="#fff1eb" stroke="#f1a98d"/><text x="771" y="339" text-anchor="middle" class="detail">FEEDBACK</text><text x="771" y="359" text-anchor="middle" class="label">Observability</text>
  </g>
  <circle class="motion" r="4" fill="#8b5cf6"><animateMotion dur="5.6s" repeatCount="indefinite" path="M648 191H771L981 103"/></circle>
  <circle class="motion" r="4" fill="#2a9d8f"><animateMotion dur="6.4s" begin="1.1s" repeatCount="indefinite" path="M837 191H998"/></circle>
</svg>
