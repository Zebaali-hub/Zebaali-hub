<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-labelledby="title desc">
  <title id="title">Conceptual backend engineering architecture</title><desc id="desc">Clients connect to an API gateway, fan out across three services, meet an event and data layer containing Kafka, PostgreSQL, and Redis, and feed observability.</desc>
  <defs><linearGradient id="layer" x1="0" x2="1"><stop stop-color="#e8f7f4"/><stop offset=".5" stop-color="#eef2ff"/><stop offset="1" stop-color="#fff0ea"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0l10 5-10 5z" fill="#98a2b3"/></marker></defs>
  <style>.s{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.title{fill:#344054;font-size:14px;font-weight:700}.meta{fill:#667085;font-size:9px;letter-spacing:.9px}.box{fill:#fff;stroke:#cdd5df;stroke-width:1.5}.flow{fill:none;stroke:#98a2b3;stroke-width:1.5;marker-end:url(#arrow)}@media(prefers-reduced-motion:reduce){.motion{display:none}}</style>
  <rect width="1200" height="450" rx="22" fill="#fbfcfe" stroke="#e4e7ec"/>
  <text x="46" y="48" class="s" fill="#101828" font-size="17" font-weight="750">BACKEND SYSTEM LANDSCAPE</text><text x="1154" y="48" text-anchor="end" class="m meta">CONCEPTUAL / NOT TO SCALE</text>
  <g class="flow"><path d="M178 120H264"/><path d="M400 120H474V98H504"/><path d="M400 120H504"/><path d="M400 120H474V184H504"/><path d="M624 98H685V286"/><path d="M624 141H685V286"/><path d="M624 184H685V286"/><path d="M685 330V378"/></g>
  <g class="box">
    <rect x="56" y="89" width="122" height="62" rx="16"/><rect x="264" y="85" width="136" height="70" rx="17"/>
    <rect x="504" y="69" width="120" height="58" rx="15"/><rect x="504" y="112" width="120" height="58" rx="15"/><rect x="504" y="155" width="120" height="58" rx="15"/>
  </g>
  <rect x="717" y="234" width="425" height="104" rx="22" fill="url(#layer)" stroke="#cdd5df"/>
  <g><rect x="747" y="265" width="104" height="50" rx="14" fill="#eeeaff" stroke="#b9a7eb"/><rect x="876" y="265" width="126" height="50" rx="14" fill="#e8f1ff" stroke="#94b7ed"/><rect x="1027" y="265" width="84" height="50" rx="14" fill="#e9f9ef" stroke="#8bd1a2"/><rect x="596" y="378" width="178" height="48" rx="15" fill="#fff1eb" stroke="#f1a98d"/></g>
  <g text-anchor="middle" class="s title"><text x="117" y="125">Clients</text><text x="332" y="125">API Gateway</text><text x="564" y="103">Service A</text><text x="564" y="146">Service B</text><text x="564" y="189">Service C</text><text x="799" y="296">Kafka</text><text x="939" y="296">PostgreSQL</text><text x="1069" y="296">Redis</text><text x="685" y="408">Observability</text></g>
  <g class="m meta"><text x="56" y="78">ENTRY</text><text x="504" y="58">DOMAIN SERVICES</text><text x="737" y="255">EVENT / DATA LAYER</text><text x="795" y="327">EVENTS</text><text x="914" y="327">STATE</text><text x="1047" y="327">CACHE</text></g>
