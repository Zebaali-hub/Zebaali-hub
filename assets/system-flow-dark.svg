<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-labelledby="title desc">
  <title id="title">Conceptual backend engineering architecture</title><desc id="desc">Clients connect to an API gateway, fan out across three services, meet an event and data layer containing Kafka, PostgreSQL, and Redis, and feed observability.</desc>
  <defs><linearGradient id="layer" x1="0" x2="1"><stop stop-color="#173e3b"/><stop offset=".5" stop-color="#292947"/><stop offset="1" stop-color="#492e26"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0l10 5-10 5z" fill="#667085"/></marker></defs>
  <style>.s{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.title{fill:#e4e7ec;font-size:14px;font-weight:700}.meta{fill:#98a2b3;font-size:9px;letter-spacing:.9px}.box{fill:#1f2937;stroke:#475467;stroke-width:1.5}.flow{fill:none;stroke:#667085;stroke-width:1.5;marker-end:url(#arrow)}@media(prefers-reduced-motion:reduce){.motion{display:none}}</style>
  <rect width="1200" height="450" rx="22" fill="#111827" stroke="#344054"/>
  <text x="46" y="48" class="s" fill="#f2f4f7" font-size="17" font-weight="750">BACKEND SYSTEM LANDSCAPE</text><text x="1154" y="48" text-anchor="end" class="m meta">CONCEPTUAL / NOT TO SCALE</text>
  <g class="flow"><path d="M178 120H264"/><path d="M400 120H474V98H504"/><path d="M400 120H504"/><path d="M400 120H474V184H504"/><path d="M624 98H685V286"/><path d="M624 141H685V286"/><path d="M624 184H685V286"/><path d="M685 330V378"/></g>
  <g class="box"><rect x="56" y="89" width="122" height="62" rx="16"/><rect x="264" y="85" width="136" height="70" rx="17"/><rect x="504" y="69" width="120" height="58" rx="15"/><rect x="504" y="112" width="120" height="58" rx="15"/><rect x="504" y="155" width="120" height="58" rx="15"/></g>
  <rect x="717" y="234" width="425" height="104" rx="22" fill="url(#layer)" stroke="#475467"/><g><rect x="747" y="265" width="104" height="50" rx="14" fill="#332d50" stroke="#7667a9"/><rect x="876" y="265" width="126" height="50" rx="14" fill="#233650" stroke="#5278ae"/><rect x="1027" y="265" width="84" height="50" rx="14" fill="#214331" stroke="#4c9b69"/><rect x="596" y="378" width="178" height="48" rx="15" fill="#4a2d26" stroke="#b16f58"/></g>
  <g text-anchor="middle" class="s title"><text x="117" y="125">Clients</text><text x="332" y="125">API Gateway</text><text x="564" y="103">Service A</text><text x="564" y="146">Service B</text><text x="564" y="189">Service C</text><text x="799" y="296">Kafka</text><text x="939" y="296">PostgreSQL</text><text x="1069" y="296">Redis</text><text x="685" y="408">Observability</text></g>
  <g class="m meta"><text x="56" y="78">ENTRY</text><text x="504" y="58">DOMAIN SERVICES</text><text x="737" y="255">EVENT / DATA LAYER</text><text x="795" y="327">EVENTS</text><text x="914" y="327">STATE</text><text x="1047" y="327">CACHE</text></g>
